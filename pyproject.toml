[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-cycle-analyzer"
version = "0.1.0"
description = "Explainable, point-in-time Bitcoin cycle analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "PyYAML>=6", "requests>=2.31", "truststore>=0.10; sys_platform == 'win32'", "MetaTrader5==5.0.6090; sys_platform == 'win32'"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
live = ["websockets>=12", "fastapi>=0.116", "uvicorn>=0.35"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.28"]
research = ["scikit-learn>=1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
